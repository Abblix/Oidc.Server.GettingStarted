name: Lint workflows

on:
  # No paths filter on pull_request: both jobs are required status checks on
  # master, and a path-filtered required check never reports on out-of-scope
  # PRs, leaving them permanently unmergeable. The jobs cost ~1 minute per PR.
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-inline-secrets:
    name: Block inline untrusted-input interpolation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

        timeout-minutes: 3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # --only-binary :all: skips arbitrary setup-script execution at install
      # time (closes Sonar S8541). --require-hashes + pinned requirements file
      # locks both the resolved version and the artifact bytes — a malicious
      # PyPI release with the same version cannot pass the hash check (closes
      # Sonar S8544).
        timeout-minutes: 3
      - name: Install PyYAML
        run: |
          pip install --disable-pip-version-check --only-binary :all: \
            --require-hashes -r .github/workflows/requirements/lint-workflows.txt

        timeout-minutes: 3
      - name: "Block inline untrusted-input interpolation in run: blocks"
        run: python .github/scripts/lint-no-inline-secrets.py

        timeout-minutes: 3
    timeout-minutes: 5
  actionlint:
    name: actionlint (schema + shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
      # The checksum is mandatory: without it the step trusts whatever the network returns and runs
      # it with the job's privileges. When bumping the version, take the sum from
      # actionlint_<version>_checksums.txt of that same release.
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

        timeout-minutes: 3
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

        timeout-minutes: 3
      - name: Run actionlint
        run: ./actionlint -color
        timeout-minutes: 3
    timeout-minutes: 5
