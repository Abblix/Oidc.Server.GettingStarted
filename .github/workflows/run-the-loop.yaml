name: Run the loop

# Starts the provider, the API and the web client with the same command a reader runs, signs in as the demo
# user, calls the API with the access token and signs out. A sample that no longer works with the others
# turns this red.
on:
  pull_request:
  push:
    branches: [master, develop]
    # Nothing below is read by the run
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: Sign in, call the API, sign out
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 3

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '11.0.x'
        timeout-minutes: 3

      # The client and the provider bundle Bootstrap with Vite when they build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
        timeout-minutes: 3

      - name: Trust the development certificate
        run: |
          status=0
          dotnet dev-certs https --trust || status=$?
          # On Linux it exits with 4 when the certificate is trusted for OpenSSL, which the three
          # samples call each other through, but not for every certificate store it tried
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            exit "$status"
          fi
        timeout-minutes: 3

      - name: Run the loop
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet run-loop.cs --check
        # Restores, builds and starts three projects, which together outrun the usual 3-minute step ceiling
        timeout-minutes: 4
    timeout-minutes: 5
